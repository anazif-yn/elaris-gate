<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elaris Gate</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Elaris Gate</h1>
      <p>A quiet place between worlds</p>
    </header>

    <!-- STEP 1: Form -->
    <section id="step-form" class="step active">
      <div class="card">
        <form id="user-form">
          <div class="form-group">
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" required autocomplete="family-name" placeholder="Your family name" />
          </div>
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name" placeholder="Your first name" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="+1 234 567 8900" />
          </div>
          <button type="submit" class="btn btn-primary" id="btn-next">Next</button>
        </form>
      </div>
    </section>

    <!-- STEP 2: Linking message -->
    <section id="step-linking" class="step">
      <div class="card">
        <div class="linking-message">
          <div class="icon">🔗</div>
          <h2>Link your phone with the website</h2>
          <p>Please wait a moment while the connection is established…</p>
        </div>
      </div>
    </section>

    <!-- STEP 3: 9 Bubbles -->
    <section id="step-bubbles" class="step">
      <div class="card bubbles-section">
        <h2>The Nine Seals</h2>
        <p class="hint">Letters will appear when the connection is complete</p>
        <div class="bubbles-grid" id="bubbles-grid">
          <!-- 9 bubbles generated by JS -->
        </div>
        <button class="btn btn-primary" id="btn-complete" disabled>Complete</button>
      </div>
    </section>

    <!-- STEP 4: The Story -->
    <section id="step-story" class="step">
      <div class="card story-section">
        <h2>The Knight Who Was Never Seen</h2>
        <div class="story-content" id="story-content"></div>
      </div>
    </section>
  </div>

  <div class="success-toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
